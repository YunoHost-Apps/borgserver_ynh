#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "borgserver"
name = "Borg Server"
description.en = "Offer backup storage to a friend"
description.fr = "Offrez un espace de stockage à un⋅e ami⋅e"

version = "1.4.5~ynh1"

maintainers = ["ljf"]

[upstream]
license = "BSD-3-Clause"
website = "https://www.borgbackup.org/"
admindoc = "https://borgbackup.readthedocs.io/en/stable/"
code = "https://github.com/borgbackup/borg"

[integration]
yunohost = ">= 11.2"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"
helpers_version = "2.1"

[install]

[resources]
    [resources.sources.main]
    url = "https://github.com/borgbackup/borg/archive/refs/tags/1.4.5.tar.gz"
    sha256 = "ce7aa6ec25029a2878b660d7e38f2720dc16fcf2b5c80780d4bf7494d4b29c04"
    # Only here to bump the package version
    prefetch = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.upstream = "https://github.com/borgbackup/borg"

    [resources.system_user]
    home = "/home/yunohost.app/__APP__"
    allow_ssh = true

    [resources.data_dir]
    dir = "/home/yunohost.app/__APP__"
    subdirs = [".ssh"]
    owner = "__APP__:rwx"
    group = "__APP__"

    [resources.install_dir]
    dir = "/opt/__APP__"

    [resources.apt]
    packages = [
        "python3",
        "python3-dev",
        "python3-pip",
        "python3-venv",
        "libacl1-dev",
        "libssl-dev",
        "liblz4-dev",
        "libzstd-dev",
        "libxxhash-dev",
        "build-essential",
        "pkg-config",
        "libfuse3-dev",
        "fuse3",
    ]
